<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text {
            color: blue;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <p>This is a text</p>
    <p id="text">This is a text</p>
    <p>This is a text</p>
    <p>This is a text</p>

    <script>
        p = document.querySelector('#text');
        
        p.classList.add("text");
    </script>
</body>
</html>
